[workspace]
members = [
    "crates/semantit-core",
    "crates/semantit-ts",
    "crates/semantit-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.83"

[workspace.dependencies]
assert_cmd = "2.1.1"
blake3 = "1.8.2"
clap = { version = "4.5.40", features = ["derive"] }
insta = { version = "1.43.2", features = ["json"] }
predicates = "3.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = "2.7.0"
strsim = "0.11.1"
swc_common = "19.0.0"
swc_ecma_ast = "21.0.0"
swc_ecma_codegen = "24.0.0"
swc_ecma_parser = "35.0.0"
swc_ecma_visit = "21.0.0"
tempfile = "3.20.0"
thiserror = "2.0.17"
